name: Build & Publish Native Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native Kotlin APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
            echo "keyPassword=$KEY_PASSWORD" >> key.properties
            echo "keyAlias=$KEY_ALIAS" >> key.properties
            echo "storeFile=release.jks" >> key.properties
          else
            echo "No keystore secret detected. Release build is signed with the debug key."
          fi

      - name: Derive Version From Tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          version="${version%%-*}"
          IFS=. read -r major minor patch <<< "$version"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          case "$major$minor$patch" in
            ''|*[!0-9]*)
              echo "::error::Tag '$tag' is not a semantic version (vX.Y.Z)"
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          NATIVE_VERSION_NAME: ${{ steps.version.outputs.name }}
          NATIVE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease

      - name: Publish Native APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset="fiBOnanci-native-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          # the flutter release workflow publishes to the same tag; only create the
          # release when that job has not, and retry when both race
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            gh release create "$TAG" --title "fiBOnanci $TAG" --generate-notes || sleep 4
          done
          gh release upload "$TAG" "$asset" --clobber
